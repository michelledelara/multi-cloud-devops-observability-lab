trigger:
- main
pr:
- main
pool:
  vmImage: ubuntu-latest
stages:
- stage: Validate
  jobs:
  - job: Quality
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - script: 'set -euo pipefail

        python -m pip install -r requirements-dev.txt

        python -m unittest discover -s tests -v

        python scripts/check_config.py

        cfn-lint cloudformation/aws/template.yaml

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml | tee /tmp/ansible-second-run.log

        grep -q ''changed=0'' /tmp/ansible-second-run.log

        '
      displayName: Validate application and configuration
  - job: Terraform
    steps:
    - bash: 'set -euo pipefail

        curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip

        unzip -o /tmp/terraform.zip -d /tmp/terraform-bin

        sudo install /tmp/terraform-bin/terraform /usr/local/bin/terraform'
      displayName: Install Terraform
    - bash: "set -euo pipefail\nterraform fmt -check -recursive terraform\nfor cloud in azure oci; do\n  terraform\
        \ -chdir=terraform/$cloud init -backend=false -input=false\n  terraform -chdir=terraform/$cloud validate\n\
        done"
      displayName: Validate Terraform providers
- stage: Integrate
  dependsOn: Validate
  jobs:
  - job: Compose
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'
    - bash: 'set -euo pipefail

        python scripts/prepare_env.py

        bash scripts/validate_containers.sh

        docker compose up -d --build

        python scripts/smoke.py'
      displayName: Build, deploy and smoke test
    - bash: 'set -euo pipefail

        docker compose logs --no-color

        docker compose down -v'
      condition: always()
      displayName: Diagnostics and cleanup
