name: Cloud Engineering CI
'on':
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - &id001
      uses: actions/checkout@v4
    - &id002
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate application and configuration
      run: 'python -m pip install -r requirements-dev.txt

        python -m unittest discover -s tests -v

        python scripts/check_config.py

        cfn-lint cloudformation/aws/template.yaml

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml --syntax-check

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml

        ansible-playbook -i ansible/inventory.ini ansible/playbook.yml | tee /tmp/ansible-second-run.log

        grep -q ''changed=0'' /tmp/ansible-second-run.log

        '
  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud:
        - azure
        - oci
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: 1.9.8
    - run: terraform fmt -check -recursive terraform
    - name: Initialize and validate provider schema
      working-directory: terraform/${{ matrix.cloud }}
      run: 'terraform init -backend=false -input=false

        terraform validate'
  compose-integration:
    runs-on: ubuntu-latest
    needs:
    - quality
    - infrastructure
    steps:
    - *id001
    - *id002
    - run: 'python scripts/prepare_env.py

        bash scripts/validate_containers.sh

        docker compose up -d --build

        python scripts/smoke.py'
    - name: Capture service logs
      if: always()
      run: 'mkdir -p evidence/runtime

        docker compose logs --no-color > evidence/runtime/compose.log'
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: compose-diagnostics
        path: evidence/runtime/
    - name: Cleanup
      if: always()
      run: docker compose down -v
  kubernetes-integration:
    runs-on: ubuntu-latest
    needs:
    - quality
    - infrastructure
    steps:
    - *id001
    - *id002
    - name: Install kind
      run: 'curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64

        chmod +x /tmp/kind

        sudo mv /tmp/kind /usr/local/bin/kind'
    - name: Deploy and verify Kubernetes stack
      run: 'bash scripts/kind_deploy.sh

        kubectl --context kind-multicloud-lab apply --dry-run=server -k .

        bash scripts/kind_smoke.sh'
    - name: Diagnostics
      if: failure()
      run: 'kubectl --context kind-multicloud-lab -n multicloud-lab get pods

        kubectl --context kind-multicloud-lab -n multicloud-lab get events --sort-by=.metadata.creationTimestamp'
    - name: Cleanup
      if: always()
      run: kind delete cluster --name multicloud-lab
